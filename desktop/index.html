<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rover Console</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, sans-serif; background: #0b0e14; color: #d8dee9;
  }
  header {
    display: flex; gap: 12px; align-items: center; padding: 10px 14px;
    background: #11151d; border-bottom: 1px solid #222;
  }
  header h1 { font-size: 16px; margin: 0 auto 0 0; }
  .pill { padding: 4px 10px; border-radius: 999px; font-size: 12px; }
  .pill.dot::before { content: "● "; }
  .online  { background: #14351c; color: #6fdc8c; }
  .offline { background: #351414; color: #dc6f6f; }

  main { display: grid; grid-template-columns: 1fr 320px; gap: 12px; padding: 12px; height: calc(100vh - 50px); }
  .col { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .panel { background: #131822; border: 1px solid #222b3a; border-radius: 10px; padding: 12px; }
  .panel h2 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: #8fa3bd; }

  .video { flex: 1; min-height: 200px; display: flex; align-items: center; justify-content: center; background:#000;}
  .video iframe { width: 100%; height: 100%; border: 0; }

  .zone { display:flex; gap:12px; flex:1; min-height:0;}
  .joywrap { flex: 1; position: relative; touch-action: none; min-height: 220px;}
  .joypad {
    position: absolute; inset: 0; border:2px dashed #2b3a52; border-radius: 12px;
    background: radial-gradient(circle at center, #13182200, #0d1117);
  }
  .knob {
    position: absolute; width: 120px; height: 120px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #2c3e5f, #16202e);
    border: 2px solid #3a5178; transform: translate(-50%,-50%);
    box-shadow: 0 6px 18px rgba(0,0,0,.5); pointer-events: none;
  }
  .joylab { position:absolute; bottom:8px; left:12px; font-size:12px; color:#5c6c83;}

  .controls { width: 200px; align-self: start;}
  .controls .grid { display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-top:8px;}
  .controls button {
    padding: 14px 8px; font-size: 14px; border-radius: 8px; border:1px solid #2b3a52;
    background:#1b2431; color:#d8dee9; cursor:pointer;
  }
  .controls button:hover { background:#24314250; }
  .controls .on { background:#2a5a3a; border-color:#3f8f5f; }
  .controls .danger { background:#5a2a2a; border-color:#8f3f3f; }
  .controls .wide { grid-column: 1 / -1; }

  table { width:100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 4px 6px; border-bottom:1px solid #1c2430; }
  td:first-child { color:#8fa3bd; }
  td:last-child { text-align:right; font-variant-numeric: tabular-nums; }
  .big { font-size: 18px; font-weight:600; }
  .stamp { font-size: 11px; color:#5c6c83; text-align:right; margin-top:-4px; }

  .row { display:flex; gap:8px; }
  .grow { flex:1; }
  select, input, button.mini {
    background:#1b2431; color:#d8dee9; border:1px solid #2b3a52; border-radius:6px; padding:6px 8px;
  }
  #events { font-family: ui-monospace, monospace; font-size: 11px; max-height: 180px; overflow:auto; }
  #events .in  { color:#8fd0a0; }
  #events .out { color:#9fc2f0; }
  #events .err { color:#f0a0a0; }
</style>
</head>
<body>

<header>
  <h1>Rover Console</h1>
  <span class="pill dot offline" id="mqttPill">MQTT</span>
  <span class="pill dot offline" id="blePill">BLE</span>
  <span class="pill dot offline" id="espPill">ESP</span>
</header>

<main>
  <div class="col">
    <div class="video panel">
      <iframe id="video" src="https://www.youtube.com/embed/?autoplay=1&mute=1"
        allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>
    <div class="zone">
      <div class="joywrap panel" id="joywrap">
        <div class="joypad"></div>
        <div class="knob" id="knob"></div>
        <div class="joylab" id="joyval">speed 0.00 | steer 0.00</div>
      </div>
      <div class="controls panel">
        <h2>Управление</h2>
        <div class="grid">
          <button id="lightBtn">Лайт</button>
          <button id="stopBtn" class="danger">СТОП</button>
          <button id="mine0">Мина 1</button>
          <button id="mine1">Мина 2</button>
          <button id="mine2">Мина 3</button>
          <button id="pingBtn">Пинг</button>
          <button id="videoFull" class="wide">Видео на весь экран</button>
        </div>
      </div>
    </div>
  </div>

  <div class="col">
    <div class="panel">
      <h2>Подключение</h2>
      <div class="row">
        <select id="wsHost" class="grow">
          <option value="wss://ed44fbaa0a7a41afaf940381fb18cd2a.s1.eu.hivemq.cloud:8884/mqtt">HiveMQ Cloud (этот ровер)</option>
          <option value="wss://broker.hivemq.com:8884/mqtt">broker.hivemq.com</option>
          <option value="wss://broker.emqx.io:8084/mqtt">broker.emqx.io</option>
          <option value="wss://test.mosquitto.org:8081">test.mosquitto.org</option>
        </select>
      </div>
      <div class="row" style="margin-top:8px;">
        <input id="mqttUser" class="grow" value="roverCred" placeholder="MQTT user" />
        <input id="mqttPass" class="grow" value="mqttHIVE!2#" placeholder="MQTT pass" />
      </div>
      <div class="row" style="margin-top:8px;">
        <input id="roverId" value="demo" class="grow" placeholder="rover id" />
        <button id="connectBtn" class="mini">Подключить</button>
        <button id="disconnectBtn" class="mini">X</button>
      </div>
      <div class="row" style="margin-top:8px;">
        <input id="ytUrl" class="grow" placeholder="URL YouTube-трансляции (Live)" />
        <button id="ytBtn" class="mini">OK</button>
      </div>
    </div>

    <div class="panel">
      <h2>Телеметрия ESP32</h2>
      <div class="stamp" id="espStamp">—</div>
      <table id="espTable"></table>
    </div>

    <div class="panel">
      <h2>Телефон (GPS/IMU)</h2>
      <div class="stamp" id="phoneStamp">—</div>
      <table id="phoneTable"></table>
    </div>

    <div class="panel">
      <h2>События <button id="clearBtn" class="mini" style="float:right;">очистить</button></h2>
      <div id="events"></div>
    </div>
  </div>
</main>

<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
<script>
'use strict';

// ---------- Настройки (localStorage) ----------
const CFG_KEY = 'rover.console.cfg.v1';
const $ = (id) => document.getElementById(id);
function saveCfg() {
  localStorage.setItem(CFG_KEY, JSON.stringify({
    host: $('wsHost').value,
    user: $('mqttUser').value,
    pass: $('mqttPass').value,
    rid: $('roverId').value,
    yt: $('ytUrl').value,
  }));
}
function loadCfg() {
  try {
    const c = JSON.parse(localStorage.getItem(CFG_KEY));
    if (!c) return;
    if (c.host) $('wsHost').value = c.host;
    if ('user' in c) $('mqttUser').value = c.user;
    if ('pass' in c) $('mqttPass').value = c.pass;
    if (c.rid) $('roverId').value = c.rid;
    if (c.yt) { $('ytUrl').value = c.yt; applyYoutube(c.yt); }
  } catch {}
}

const rid = () => $('roverId').value.trim() || 'demo';
const topic = (name) => `rover/${rid()}/${name}`;

// ---------- Лог событий ----------
function log(msg, cls) {
  const e = $('events');
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = `${new Date().toLocaleTimeString()}  ${msg}`;
  e.appendChild(d);
  while (e.children.length > 300) e.removeChild(e.firstChild);
  e.scrollTop = e.scrollHeight;
}

// ---------- MQTT ----------
let client = null;
let pingTimer = null;
let subTimer = null;
const pill = (id, ok) => { $(id).className = 'pill dot ' + (ok ? 'online' : 'offline'); };

function publish(sub, obj) {
  if (!client || !client.connected) return;
  client.publish(topic(sub), JSON.stringify(obj), { qos: 0 });
  log(`→ ${topic(sub)}  ${JSON.stringify(obj)}`, 'out');
}

function connectMqtt() {
  saveCfg();
  if (client) { try { client.end(true); } catch {} client = null; }
  pill('mqttPill', false);

  const opts = {
    clientId: 'pc-' + Math.random().toString(16).slice(2, 10),
    keepalive: 20,
    reconnectPeriod: 3000,
    connectTimeout: 10000,
  };
  const user = $('mqttUser').value.trim();
  const pass = $('mqttPass').value.trim();
  if (user) { opts.username = user; opts.password = pass; }

  log(`Подключаюсь к ${$('wsHost').value}...`);
  client = mqtt.connect($('wsHost').value, opts);

  client.on('connect', () => {
    pill('mqttPill', true);
    log('MQTT подключён ✓');
    ['cmd','action','sensors','esptelemetry','status'].forEach((s) => client.subscribe(topic(s)));
    clearInterval(pingTimer);
    pingTimer = setInterval(() => publish('action', { type: 'ping' }), 20000);
  });
  client.on('close', () => { pill('mqttPill', false); log('MQTT отключён', 'err'); });
  client.on('error', (e) => {
    pill('mqttPill', false);
    log('MQTT ошибка: ' + (e && e.message ? e.message : e), 'err');
  });
  client.on('message', (t, p) => {
    const kind = t.split('/').pop();
    let m; try { m = JSON.parse(p.toString()); }
    catch { log(`⇣ ${t}  (не JSON) ${p.toString()}`, 'in'); return; }
    log(`⇣ ${t}  ${p.toString()}`, 'in');
    onMessage(kind, m);
  });
}

// ---------- Обработка входящих ----------
function rows(pairs) {
  return pairs.map(([k, v, big]) =>
    `<tr><td>${k}</td><td class="${big?'big':''}">${v}</td></tr>`).join('');
}
function onMessage(kind, m) {
  if (kind === 'esptelemetry') {
    pill('espPill', true);
    $('espStamp').textContent = new Date().toLocaleTimeString();
    $('espTable').innerHTML = rows([
      ['Батарея', (m.battery ?? 0).toFixed(1) + ' V', 1],
      ['Мотор L', m.left_pwm + ' %'],
      ['Мотор R', m.right_pwm + ' %'],
      ['Наклон', (m.esp_tilt_deg ?? 0).toFixed(1) + '°'],
      ['Tilt (защ.)', (m.tilted ? 'ДА' : 'нет')],
      ['Watchdog', (m.watchdog_stop ? 'ДА' : 'нет')],
      ['Темп. MCU', (m.mc_temp_c ?? 0) + '°C'],
      ['ACK seq', m.ack_seq],
      ['ACK st.', m.ack_status],
    ]);
  } else if (kind === 'sensors') {
    $('phoneStamp').textContent = new Date().toLocaleTimeString();
    const g = m.gps;
    $('phoneTable').innerHTML = rows([
      ['Батарея тел.', (m.battery_pct ?? '?') + ' %'],
      ['Наклон тел.', (m.tilt_deg ?? 0).toFixed(1) + '°'],
      ['GPS', g ? `${g.lat.toFixed(6)}, ${g.lon.toFixed(6)}` : 'нет', 1],
      ['Точность', g ? g.acc_m + ' м' : '-'],
      ['Скорость', g ? g.speed_mps + ' м/с' : '-'],
      ['GPS время', g ? new Date(g.ts_ms).toLocaleTimeString() : '-'],
      ['Gyro', m.imu ? `(${m.imu.gx.toFixed(1)},${m.imu.gy.toFixed(1)},${m.imu.gz.toFixed(1)})` : '-'],
    ]);
  } else if (kind === 'status') {
    if ('ble_connected' in m) pill('blePill', !!m.ble_connected);
    if ('mqtt_connected' in m) pill('mqttPill', !!m.mqtt_connected);
  }
}

// ---------- Джойстик ----------
const wrap = $('joywrap');
const knob = $('knob');
let dragging = false;
function updateJoystick() {
  const r = wrap.getBoundingClientRect();
  const cx = r.width / 2, cy = r.height / 2, rad = Math.min(cx, cy) * 0.75;
  const dx = (knob.offsetLeft + 60 - cx) / rad;
  const dy = (knob.offsetTop + 60 - cy) / rad;
  const speed = -dy, steer = dx;
  publish('cmd', { speed: +speed.toFixed(2), steer: +steer.toFixed(2) });
  $('joyval').textContent = `speed ${speed.toFixed(2)} | steer ${steer.toFixed(2)}`;
}
wrap.addEventListener('pointerdown', (e) => { dragging = true; wrap.setPointerCapture(e.pointerId); moveKnob(e); });
wrap.addEventListener('pointermove', (e) => { if (dragging) moveKnob(e); });
window.addEventListener('pointerup', () => {
  if (!dragging) return;
  dragging = false;
  knob.style.left = '50%'; knob.style.top = '50%';
  publish('cmd', { speed: 0, steer: 0 });
  $('joyval').textContent = 'speed 0.00 | steer 0.00';
});
function moveKnob(e) {
  const r = wrap.getBoundingClientRect();
  const cx = r.width / 2, cy = r.height / 2, rad = Math.min(cx, cy) * 0.75;
  let dx = e.clientX - r.left - cx, dy = e.clientY - r.top - cy;
  const dist = Math.hypot(dx, dy);
  if (dist > rad) { dx = dx / dist * rad; dy = dy / dist * rad; }
  knob.style.left = (cx + dx) + 'px';
  knob.style.top = (cy + dy) + 'px';
  updateJoystick();
}

// ---------- Доп. клавиши (стрелки = движение) ----------
const KEYSPEED = 0.8;
const keyState = { up:false, down:false, left:false, right:false };
let keyTimer = null;
function driveFromKeys() {
  let speed = (keyState.up ? 1 : 0) - (keyState.down ? 1 : 0);
  let steer = (keyState.right ? 1 : 0) - (keyState.left ? 1 : 0);
  speed *= KEYSPEED; steer *= KEYSPEED;
  publish('cmd', { speed: +speed.toFixed(2), steer: +steer.toFixed(2) });
}
window.addEventListener('keydown', (e) => {
  const map = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right' };
  if (!map[e.key]) return;
  e.preventDefault();
  keyState[map[e.key]] = true;
  driveFromKeys();
  clearInterval(keyTimer);
  keyTimer = setInterval(driveFromKeys, 150);
});
window.addEventListener('keyup', (e) => {
  const map = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right' };
  if (!map[e.key]) return;
  keyState[map[e.key]] = false;
  driveFromKeys();
});

// ---------- Кнопки ----------
$('lightBtn').onclick = function () {
  const on = !this.classList.contains('on');
  this.classList.toggle('on', on);
  publish('action', { type: 'light', on });
};
$('stopBtn').onclick = () => publish('action', { type: 'stop' });
[0, 1, 2].forEach((i) => {
  $('mine' + i).onclick = () => publish('action', { type: 'mine', channel: i });
});
$('pingBtn').onclick = () => publish('action', { type: 'ping' });

// ---------- Видео ----------
function applyYoutube(url) {
  if (!url) return;
  let id = url.match(/[?&]v=([\w-]{6,15})/);
  if (!id) id = url.match(/youtu\.be\/([\w-]{6,15})/);
  if (!id) id = url.match(/^([\w-]{6,15})$/);
  if (!id) { log('Не смог разобрать YouTube URL', 'err'); return; }
  $('video').src = `https://www.youtube.com/embed/${id[1]}?autoplay=1&mute=1`;
  log('Видео: ' + id[1]);
}
$('ytBtn').onclick = () => { saveCfg(); applyYoutube($('ytUrl').value.trim()); };
$('videoFull').onclick = () => {
  const v = $('video'); if (v.requestFullscreen) v.requestFullscreen();
};

// ---------- Старт ----------
$('connectBtn').onclick = connectMqtt;
$('disconnectBtn').onclick = () => {
  if (client) client.end(true);
  clearInterval(pingTimer);
  ['mqttPill','blePill','espPill'].forEach((p) => pill(p, false));
  log('Отключено');
};
$('clearBtn').onclick = () => { $('events').innerHTML = ''; };
loadCfg();
connectMqtt();
</script>
</body>
</html>
